name: Build + Release (32-bit + 64-bit)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oldphone-universal-${{ github.ref }}
  cancel-in-progress: true

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}

jobs:
  build:
    name: Build old-phone universal APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Resolve version
        run: |
          app_version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          short_sha="$(git rev-parse --short HEAD)"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v2.2.0-2687-fix" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      - name: Validate required build secrets
        run: |
          test -n "$DANDANAPI_APPID"
          test -n "$DANDANAPI_KEY"
        shell: bash

      - name: Remove jni build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
        shell: bash

      - name: Run Flutter tests
        run: flutter test
        shell: bash

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --fatal-warnings
        shell: bash

      - name: Build Flutter APK (fat, all ABIs)
        run: >-
          flutter build apk
          --build-number=20201
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
        shell: bash

      - name: Build libmpv v1.3.0 HLS fix for API 24
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Predidit/libmpv-android-video-build.git libmpv-build
          cd libmpv-build
          git fetch --depth 1 origin e09ec94907f07d38620ff54894810037a7bc0c4f
          git checkout --detach e09ec94907f07d38620ff54894810037a7bc0c4f
          sed -i 's/local apilvl=26/local apilvl=24/' buildscripts/build.sh
          cd buildscripts
          ./download.sh
          ./patch.sh
          cp flavors/default.sh scripts/ffmpeg.sh
          ./build.sh --arch arm64
          ./build.sh --arch armv7l
          cd deps/media-kit-android-helper
          chmod +x gradlew
          ./gradlew assembleRelease
          unzip -o app/build/outputs/apk/release/app-release.apk -d app/build/outputs/apk/release
          cp app/build/outputs/apk/release/lib/arm64-v8a/libmediakitandroidhelper.so ../../prefix/arm64-v8a/usr/local/lib/
          cp app/build/outputs/apk/release/lib/armeabi-v7a/libmediakitandroidhelper.so ../../prefix/armeabi-v7a/usr/local/lib/
          cd ../..
          mkdir -p temp/lib/arm64-v8a temp/lib/armeabi-v7a
          cp prefix/arm64-v8a/usr/local/lib/*.so temp/lib/arm64-v8a/
          cp prefix/armeabi-v7a/usr/local/lib/*.so temp/lib/armeabi-v7a/
          cd temp
          find lib/arm64-v8a -type f | sort | zip -r -X ../default-arm64-v8a-api24.jar -@
          find lib/armeabi-v7a -type f | sort | zip -r -X ../default-armeabi-v7a-api24.jar -@
          cd ../..
          python3 tools/verify_libmpv_android_api.py \
            libmpv-build/buildscripts/default-arm64-v8a-api24.jar 24
          python3 tools/verify_libmpv_android_api.py \
            libmpv-build/buildscripts/default-armeabi-v7a-api24.jar 24
        shell: bash

      - name: Swap both ABIs to compatibility libmpv
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Kazumi.apk

          zip -d Kazumi.apk lib/arm64-v8a/libmpv.so || true
          zip -d Kazumi.apk lib/arm64-v8a/libmediakitandroidhelper.so || true
          zip -d Kazumi.apk lib/armeabi-v7a/libmpv.so || true
          zip -d Kazumi.apk lib/armeabi-v7a/libmediakitandroidhelper.so || true

          mkdir -p libswap/lib/arm64-v8a libswap/lib/armeabi-v7a
          unzip -o libmpv-build/buildscripts/default-arm64-v8a-api24.jar -d arm64_libs/
          unzip -o libmpv-build/buildscripts/default-armeabi-v7a-api24.jar -d arm32_libs/
          cp arm64_libs/lib/arm64-v8a/libmpv.so libswap/lib/arm64-v8a/
          cp arm64_libs/lib/arm64-v8a/libmediakitandroidhelper.so libswap/lib/arm64-v8a/
          cp arm32_libs/lib/armeabi-v7a/libmpv.so libswap/lib/armeabi-v7a/
          cp arm32_libs/lib/armeabi-v7a/libmediakitandroidhelper.so libswap/lib/armeabi-v7a/

          cd libswap
          zip -r ../Kazumi.apk lib/
          cd ..

          test "$(unzip -p Kazumi.apk lib/arm64-v8a/libmediakitandroidhelper.so | sha256sum | awk '{print $1}')" = "a6862031015e390aa8a64536411132cf4df6a5a9dcf782f0d68b995380a1cccb"
          test "$(unzip -p Kazumi.apk lib/armeabi-v7a/libmediakitandroidhelper.so | sha256sum | awk '{print $1}')" = "698ce761945a3bdaf6ffe690e715fc510bc30a3571c5ac6768a734847232d5cc"

          python3 tools/verify_libmpv_android_api.py Kazumi.apk 24

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -f -p 4 Kazumi.apk Kazumi-aligned.apk
          mv Kazumi-aligned.apk Kazumi.apk
        shell: bash

      - name: Sign APK
        run: |
          echo "$KAZUMI_KEYSTORE_BASE64" | base64 -d > kazumi-release.jks
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks kazumi-release.jks \
            --ks-pass "pass:$KAZUMI_KEYSTORE_PASSWORD" \
            --ks-key-alias "$KAZUMI_KEY_ALIAS" \
            --key-pass "pass:$KAZUMI_KEY_PASSWORD" \
            Kazumi.apk

          "$APKSIGNER" verify --verbose --print-certs Kazumi.apk | tee apk-signature.txt
          grep -qi "fece83f953fbe954298fee2201b63962266c377dbfa305a83058a48a9a255ad7" apk-signature.txt
        shell: bash
        env:
          KAZUMI_KEYSTORE_BASE64: ${{ secrets.KAZUMI_KEYSTORE_BASE64 }}
          KAZUMI_KEYSTORE_PASSWORD: ${{ secrets.KAZUMI_KEYSTORE_PASSWORD }}
          KAZUMI_KEY_ALIAS: ${{ secrets.KAZUMI_KEY_ALIAS }}
          KAZUMI_KEY_PASSWORD: ${{ secrets.KAZUMI_KEY_PASSWORD }}

      - name: Inspect APK native libraries
        run: |
          unzip -l Kazumi.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/(libmpv|libmediakitandroidhelper)\.so'

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging Kazumi.apk | tee apk-badging.txt
          grep -q "versionName='2.2.0'" apk-badging.txt
          grep -q "versionCode='20201'" apk-badging.txt
          grep -q "sdkVersion:'24'" apk-badging.txt
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Kazumi-oldphone-universal
          path: Kazumi.apk

      - name: Update existing test release APK
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" Kazumi.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
