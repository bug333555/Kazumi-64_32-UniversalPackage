name: Kazumi 2.3.9 formal universal APK

on:
  push:
    branches:
      - codex/kazumi-2.3.9-legacy-hud
  workflow_dispatch:

permissions:
  contents: read

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}

jobs:
  android:
    name: Build fixed-signature ARM universal APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libasound2-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run focused regression tests
        run: flutter test test/rule_engine_test.dart test/video_source_format_test.dart test/player_adjustment_hud_test.dart

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Build universal APK
        run: >-
          flutter build apk --release
          --build-name=2.3.9
          --build-number=20310
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY

      - name: Replace ARM native libraries with validated self-built set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          replacements = {
              'lib/arm64-v8a/libmpv.so': Path('trial_assets/native/arm64-v8a/libmpv.so'),
              'lib/arm64-v8a/libmediakitandroidhelper.so': Path('trial_assets/native/arm64-v8a/libmediakitandroidhelper.so'),
              'lib/armeabi-v7a/libmpv.so': Path('trial_assets/native/armeabi-v7a/libmpv.so'),
              'lib/armeabi-v7a/libmediakitandroidhelper.so': Path('trial_assets/native/armeabi-v7a/libmediakitandroidhelper.so'),
          }
          temp = apk.with_suffix('.swapped.apk')
          with zipfile.ZipFile(apk, 'r') as source, zipfile.ZipFile(temp, 'w', zipfile.ZIP_DEFLATED) as target:
              for info in source.infolist():
                  if info.filename not in replacements:
                      target.writestr(info, source.read(info.filename))
              for name, path in replacements.items():
                  target.write(path, name)
          temp.replace(apk)
          PY

      - name: Zipalign unsigned APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-release-aligned.apk
          mv build/app/outputs/flutter-apk/app-release-aligned.apk \
             build/app/outputs/flutter-apk/app-release.apk

      - name: Verify package and native library hashes before signing
        run: |
          mkdir -p build/formal
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          expected = {
              'lib/arm64-v8a/libmpv.so': '087ec82b44ef8628b6d40c9bf9366bed568681aeb006704488b8760caaa02be0',
              'lib/arm64-v8a/libmediakitandroidhelper.so': 'a6862031015e390aa8a64536411132cf4df6a5a9dcf782f0d68b995380a1cccb',
              'lib/armeabi-v7a/libmpv.so': '6fe82d0619cfb3afc5781626939cafdbacf6e12640b790c797e652c020d80a22',
              'lib/armeabi-v7a/libmediakitandroidhelper.so': '698ce761945a3bdaf6ffe690e715fc510bc30a3571c5ac6768a734847232d5cc',
          }
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for name, digest in expected.items():
                  if name not in names:
                      raise SystemExit(f'missing {name}')
                  actual = hashlib.sha256(z.read(name)).hexdigest()
                  if actual != digest:
                      raise SystemExit(f'{name}: {actual} != {digest}')
          PY
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging build/app/outputs/flutter-apk/app-release.apk | tee build/formal/badging-before-sign.txt
          grep -q "package: name='com.predidit.kazumi' versionCode='20310' versionName='2.3.9'" build/formal/badging-before-sign.txt
          grep -q "sdkVersion:'24'" build/formal/badging-before-sign.txt
          grep -q "targetSdkVersion:'36'" build/formal/badging-before-sign.txt

      - name: Sign with the fixed release key
        env:
          KAZUMI_KEYSTORE_BASE64: ${{ secrets.KAZUMI_KEYSTORE_BASE64 }}
          KAZUMI_KEYSTORE_PASSWORD: ${{ secrets.KAZUMI_KEYSTORE_PASSWORD }}
          KAZUMI_KEY_ALIAS: ${{ secrets.KAZUMI_KEY_ALIAS }}
          KAZUMI_KEY_PASSWORD: ${{ secrets.KAZUMI_KEY_PASSWORD }}
        run: |
          test -n "$KAZUMI_KEYSTORE_BASE64"
          test -n "$KAZUMI_KEYSTORE_PASSWORD"
          test -n "$KAZUMI_KEY_ALIAS"
          test -n "$KAZUMI_KEY_PASSWORD"
          echo "$KAZUMI_KEYSTORE_BASE64" | base64 -d > build/formal/kazumi-release.jks
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks build/formal/kazumi-release.jks \
            --ks-pass "pass:$KAZUMI_KEYSTORE_PASSWORD" \
            --ks-key-alias "$KAZUMI_KEY_ALIAS" \
            --key-pass "pass:$KAZUMI_KEY_PASSWORD" \
            --out build/formal/Kazumi.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/formal/Kazumi.apk | tee build/formal/signature.txt
          grep -qi "fece83f953fbe954298fee2201b63962266c377dbfa305a83058a48a9a255ad7" build/formal/signature.txt

      - name: Prepare formal artifact manifest
        run: |
          sha256sum build/formal/Kazumi.apk | tee build/formal/SHA256SUMS.txt
          printf '%s\n' \
            'source version: 2.3.9+20310' \
            'package: com.predidit.kazumi' \
            'artifact: Kazumi.apk' \
            'build type: GitHub Actions formal candidate; no Release mutation in this workflow' \
            'signature: fixed release key; compatible with the existing com.predidit.kazumi install' \
            'UI: restored compact 2.2.0 playback source tabs and source detail layout' \
            'HUD: stateless legacy black54 text/icon overlays; no HUD animation, shadows or progress painters' \
            'XPath chapter cookies: same-site host/subdomain handling for issue 2734' \
            'ARM native set: validated self-built v1.1.5/API21 libmpv + helper for arm64-v8a and armeabi-v7a' \
            'tests: focused rule-engine, video-source and legacy HUD widget regression tests' \
            'analyze: flutter analyze --no-fatal-infos --fatal-warnings' \
            'ABI verification: arm64-v8a and armeabi-v7a entries present and hash-checked' \
            > build/formal/BUILD-MANIFEST.txt
          rm -f build/formal/kazumi-release.jks

      - name: Upload formal candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: kazumi-2.3.9-formal-universal
          path: build/formal
          if-no-files-found: error
